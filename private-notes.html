<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Private Notes</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles.css">
    <style>
      .private-shell {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 80px;
      }

      .unlock-panel,
      .private-content {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .unlock-panel form {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .unlock-panel label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 0.9rem;
        font-weight: 750;
      }

      .unlock-panel input {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
      }

      .unlock-panel button,
      .private-tab-button {
        min-height: 40px;
        padding: 8px 14px;
        border: 1px solid var(--green);
        border-radius: 8px;
        background: var(--green);
        color: #ffffff;
        cursor: pointer;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 0.92rem;
        font-weight: 800;
      }

      .status {
        min-height: 1.5em;
        margin: 12px 0 0;
        color: var(--muted);
      }

      .private-content {
        margin-top: 24px;
      }

      .private-content[hidden] {
        display: none;
      }

      .private-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0 24px;
      }

      .private-tab-button[aria-selected="false"] {
        border-color: var(--line);
        background: var(--surface);
        color: var(--green-dark);
      }

      .private-pane[hidden] {
        display: none;
      }

      .private-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .private-box {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffdf8;
      }

      .private-box h3 {
        margin-bottom: 10px;
        color: var(--blue);
      }

      @media (max-width: 720px) {
        .private-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"><span>Sreejith A V</span></a>
      <nav class="nav" aria-label="Private page navigation">
        <a href="index.html">Public site</a>
      </nav>
    </header>

    <main class="private-shell">
      <section class="unlock-panel">
        <p class="section-kicker">Encrypted Page</p>
        <h1>Private Notes</h1>
        <p>
          This page downloads an encrypted file from GitHub Pages and decrypts it locally in your browser.
          The passphrase is not sent anywhere.
        </p>
        <form id="unlock-form">
          <label>
            Passphrase
            <input id="passphrase" type="password" autocomplete="current-password" required autofocus>
          </label>
          <button type="submit">Decrypt</button>
        </form>
        <p class="status" id="status" role="status"></p>
      </section>

      <section class="private-content" id="private-content" hidden aria-live="polite"></section>
    </main>

    <script>
      const encryptedPath = "private-notes.enc.json";
      const form = document.querySelector("#unlock-form");
      const passphraseInput = document.querySelector("#passphrase");
      const statusNode = document.querySelector("#status");
      const contentNode = document.querySelector("#private-content");

      function base64ToBytes(value) {
        return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      }

      async function deriveKey(passphrase, salt, iterations) {
        const material = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(passphrase),
          "PBKDF2",
          false,
          ["deriveKey"]
        );

        return crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt, iterations },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      }

      function activatePrivateTabs(root) {
        const buttons = Array.from(root.querySelectorAll("[data-private-tab]"));
        const panes = Array.from(root.querySelectorAll("[data-private-pane]"));

        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            const target = button.dataset.privateTab;
            buttons.forEach((item) => item.setAttribute("aria-selected", String(item === button)));
            panes.forEach((pane) => {
              pane.hidden = pane.dataset.privatePane !== target;
            });
          });
        });
      }

      function formatDate(date, options) {
        return new Intl.DateTimeFormat("en-IN", options).format(date);
      }

      function isoDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function getWeekDates(baseDate) {
        const monday = new Date(baseDate);
        const day = monday.getDay() || 7;
        monday.setDate(monday.getDate() - day + 1);
        monday.setHours(0, 0, 0, 0);

        return Array.from({ length: 7 }, (_, index) => {
          const date = new Date(monday);
          date.setDate(monday.getDate() + index);
          return date;
        });
      }

      function hydratePrivateCalendar(root) {
        const today = new Date();
        const weekDates = getWeekDates(today);
        const todayIso = isoDate(today);
        const weekStartIso = isoDate(weekDates[0]);
        const weekEndIso = isoDate(weekDates[6]);

        root.querySelectorAll("[data-today-label]").forEach((node) => {
          node.textContent = formatDate(today, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        });

        root.querySelectorAll("[data-week-range]").forEach((node) => {
          node.textContent = `${formatDate(weekDates[0], { day: "numeric", month: "short" })} - ${formatDate(weekDates[6], { day: "numeric", month: "short", year: "numeric" })}`;
        });

        root.querySelectorAll("[data-week-day]").forEach((node) => {
          const index = Number(node.dataset.weekDay);
          const date = weekDates[index];
          if (!date) {
            return;
          }
          const dayName = node.querySelector("[data-day-name]");
          const dayDate = node.querySelector("[data-day-date]");
          if (dayName) {
            dayName.textContent = formatDate(date, { weekday: "short" });
          }
          if (dayDate) {
            dayDate.textContent = formatDate(date, { day: "numeric", month: "short" });
          }
          node.classList.toggle("is-today", isoDate(date) === todayIso);
        });

        root.querySelectorAll("[data-event-date]").forEach((event) => {
          const date = event.dataset.eventDate;
          event.hidden = date !== todayIso && (date < weekStartIso || date > weekEndIso);
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusNode.textContent = "Decrypting...";
        contentNode.hidden = true;
        contentNode.replaceChildren();

        try {
          const encrypted = await fetch(encryptedPath, { cache: "no-store" }).then((response) => {
            if (!response.ok) {
              throw new Error(`Could not load ${encryptedPath}`);
            }
            return response.json();
          });

          const salt = base64ToBytes(encrypted.salt);
          const iv = base64ToBytes(encrypted.iv);
          const ciphertext = base64ToBytes(encrypted.ciphertext);
          const key = await deriveKey(passphraseInput.value, salt, encrypted.iterations);
          const plaintextBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
          const plaintext = new TextDecoder().decode(plaintextBuffer);

          contentNode.innerHTML = plaintext;
          activatePrivateTabs(contentNode);
          hydratePrivateCalendar(contentNode);
          contentNode.hidden = false;
          statusNode.textContent = "Decrypted locally.";
          passphraseInput.value = "";
        } catch (error) {
          statusNode.textContent = "Could not decrypt. Check the passphrase and encrypted file.";
        }
      });
    </script>
  </body>
</html>
